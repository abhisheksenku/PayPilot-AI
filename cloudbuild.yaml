# Google Cloud Build Pipeline for PayPilot AI
# Target: Google Cloud Run (asia-south1 / Mumbai)
# Event: Google DeepMind × Google Cloud Startup Buildathon India 2026

steps:
  # 1. Build Backend Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/paypilot-backend:$COMMIT_SHA', './backend']

  # 2. Push Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/paypilot-backend:$COMMIT_SHA']

  # 3. Deploy Backend to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'paypilot-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/paypilot-backend:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

  # 4. Build Frontend Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=https://paypilot-backend-asia-south1.a.run.app/api'
      - '-t'
      - 'gcr.io/$PROJECT_ID/paypilot-frontend:$COMMIT_SHA'
      - './frontend'

  # 5. Push Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/paypilot-frontend:$COMMIT_SHA']

  # 6. Deploy Frontend to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'paypilot-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/paypilot-frontend:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/paypilot-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/paypilot-frontend:$COMMIT_SHA'
