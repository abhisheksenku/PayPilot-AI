version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: paypilot-mysql
    restart: always
    environment:
      MYSQL_DATABASE: paypilot_ai
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paypilot-backend
    restart: on-failure
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost:3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ''
      DB_NAME: paypilot_ai
      ENABLE_SEED_DATA: 'true'
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PAYPAL_MODE: sandbox
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      CHANNEL3_API_KEY: ${CHANNEL3_API_KEY:-}
    ports:
      - '5000:5000'
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
        NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
        NEXT_PUBLIC_ENABLE_SEED_DATA: 'true'
    container_name: paypilot-frontend
    restart: on-failure
    environment:
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  mysql_data:
